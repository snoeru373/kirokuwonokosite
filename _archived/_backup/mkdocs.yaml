# MkDocs Configuration for free affiliate site skeleton.
# nav references articles that live OUTSIDE the docs/ tree;
# we list them explicitly so mkdocs no longer warns about unresolved links.

site_name: 50代からのローカルAI実践ノート
site_description: Ubuntu + ローカルAI + note連携の等身大アフィリエイト実践記
site_author: seoeru（しのえる）
repo_url: https://github.com/seoeru/ai-practical-note

theme:
  name: material
  language: ja
  palette:
    primary: deep purple
    accent: teal
  features:
    - content.code.copy
    - navigation.instant
    - search.highlight
    - toc.follow
    - header.autohide

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - ホーム: index.md
  - プロフィール (管理人): profile.md
  - Ubuntu: ubuntu.md
  - ローカルAI: local-ai.md
  - Hermes Agent: hermes-agent.md
  - Obsidian外部脳: obsidian-external-brain.md
  - GitHub Pages: github-pages-setup.md
  - note運用: note-affiliate.md
  - 無料アフィリエイト: free-affiliate.md
  - 失敗談・改善記録: failures-and-improvements.md
  - "📢 広告表記": disclosure.md
  - "📝 記事一覧（draft）":
    - UbuntuでローカルAI環境を作ってみた: drafts/article-01-50-kara-ubuntu.md
    - OllamaとOpen WebUI：できること・できないこと: drafts/article-02-ollama-open-webui.md
    - Hermes AgentでObsidianを外部脳にする方法: drafts/article-03-hermes-agent-ob.md
    - GitHub Pagesで無料アフィリエイトサイトをつくる手順: drafts/article-04-github-pages-website.md
    - WordPressを使わず無料で副業サイトを作る方法: drafts/article-05-no-wordpress.md
    - ChatGPTとCanva無料版でnote記事が作れるか: drafts/article-06-chatgpt-canva-note.md
    - ローカルAIとクラウドAIの無料運用比較: drafts/article-07-local-cloud-comparison.md
    - AI記事作成でやってはいけないこと: drafts/article-08-ai-writing-mistakes.md
    - Ubuntu初心者がAI環境構築でつまずいたこと10選: drafts/article-09-ubuntu-start-mistakes.md
    - 無料で始めるアフィリエイトASP比較: drafts/article-10-free-aspx-comparison.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/seoeru_computer
    - icon: fontawesome/solid/book
      link: https://note.com/vivid_hebe1526
  generator: false
