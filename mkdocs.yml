site_name: 50代からのローカルAI実践ノート
site_url: https://snoeru373.github.io/kirokuwonokosite/
repo_url: https://github.com/snoeru373/kirokuwonokosite
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.integrate
    - content.code.copy

